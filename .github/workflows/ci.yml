name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.17", "1.21", "1.22", "1.23"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install libpcre
        run: sudo apt-get update && sudo apt-get install -y libpcre3-dev
      - name: Test
        run: go test -v -count=1 ./...
      - name: Vet
        run: go vet ./...
